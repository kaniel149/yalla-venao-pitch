<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalla Venao — Business Directory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF6B35;
  --primary-dark: #E85520;
  --accent: #1B4332;
  --accent-light: #27AE60;
  --gold: #FFD166;
  --bg: #0F1117;
  --surface: #161922;
  --surface-2: #1C2030;
  --text: #F4F4F5;
  --text-secondary: #A1A1AA;
  --text-muted: #52525B;
  --border: rgba(255,255,255,0.06);
  --radius: 16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}

/* Nav */
.top-bar{position:sticky;top:0;z-index:100;background:rgba(15,17,23,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.top-bar a{color:var(--primary);font-weight:600;text-decoration:none;font-size:14px}
.top-bar h1{font-size:20px;color:var(--text)}
.top-bar .count{color:var(--text-secondary);font-size:14px;font-family:'Plus Jakarta Sans',sans-serif}

/* Filter tabs */
.filters{display:flex;gap:8px;padding:20px 24px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:1200px;margin:0 auto}
.filters::-webkit-scrollbar{display:none}
.filter-btn{padding:8px 18px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Grid */
.grid{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}

/* Business Card */
.biz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .3s;position:relative}
.biz-card:hover{transform:translateY(-4px);border-color:rgba(255,107,53,0.3);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.biz-card .img{height:180px;background-size:cover;background-position:center;position:relative}
.biz-card .img::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,0.6))}
.biz-card .badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;z-index:1}
.badge-food{background:#FF6B35;color:#fff}
.badge-experience{background:#27AE60;color:#fff}
.badge-stay{background:#3498DB;color:#fff}
.badge-drinks{background:#E67E22;color:#fff}
.badge-grocery{background:#1B4332;color:#fff}
.badge-wellness{background:#9B59B6;color:#fff}
.badge-surf{background:#0EA5E9;color:#fff}
.biz-card .info{padding:16px}
.biz-card .name{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:4px}
.biz-card .desc{color:var(--text-secondary);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.biz-card .meta{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--text-muted)}
.biz-card .star{color:var(--gold)}
.biz-card .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.biz-card .tag{padding:3px 8px;border-radius:6px;font-size:11px;background:rgba(255,255,255,0.05);color:var(--text-secondary)}

/* Modal overlay */
.modal-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);overflow-y:auto;padding:40px 20px}
.modal-overlay.open{display:flex;justify-content:center;align-items:flex-start}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;max-width:900px;width:100%;overflow:hidden;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(0.97)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.modal-hero{height:280px;background-size:cover;background-position:center;position:relative}
.modal-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--surface))}
.modal-body{padding:24px 32px 32px;position:relative}
.modal-body .name{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:4px}
.modal-body .desc{color:var(--text-secondary);font-size:14px;line-height:1.7;margin-bottom:20px}
.modal-body .meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px;font-size:13px;color:var(--text-secondary)}
.modal-body .meta-row span{display:flex;align-items:center;gap:6px}
.modal-body .meta-row .icon{font-size:16px}

/* Two columns: menu + phone mockup */
.modal-columns{display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:start}
@media(max-width:700px){.modal-columns{grid-template-columns:1fr}}

/* Menu items */
.menu-section h3{font-size:16px;margin-bottom:16px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px}
.menu-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.menu-item:last-child{border-bottom:none}
.menu-item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0}
.menu-item .mi-info{flex:1;min-width:0}
.menu-item .mi-name{font-weight:600;font-size:14px;margin-bottom:2px}
.menu-item .mi-desc{font-size:12px;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu-item .mi-price{font-weight:700;color:var(--primary);font-size:14px;white-space:nowrap;margin-left:8px}

/* Phone mockup */
.phone-mockup{background:#000;border-radius:36px;padding:12px;border:3px solid #333;position:sticky;top:100px}
.phone-screen{background:#fff;border-radius:26px;overflow:hidden;aspect-ratio:9/19.5}
.phone-screen .ps-header{background:var(--primary);padding:40px 16px 16px;color:#fff}
.phone-screen .ps-header .ps-back{font-size:12px;opacity:0.8;margin-bottom:8px}
.phone-screen .ps-header .ps-name{font-size:16px;font-weight:700}
.phone-screen .ps-header .ps-meta{font-size:11px;opacity:0.8;margin-top:2px}
.phone-screen .ps-img{height:120px;background-size:cover;background-position:center}
.phone-screen .ps-info{padding:12px 14px}
.phone-screen .ps-info .ps-title{font-size:14px;font-weight:700;color:#111;margin-bottom:4px}
.phone-screen .ps-info .ps-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.phone-screen .ps-info .ps-tag{font-size:9px;padding:2px 6px;background:#f0f0f0;border-radius:4px;color:#555}
.phone-screen .ps-items{padding:0 14px 14px}
.phone-screen .ps-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.phone-screen .ps-item img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.phone-screen .ps-item .psi-name{font-size:11px;font-weight:600;color:#222;flex:1}
.phone-screen .ps-item .psi-price{font-size:11px;font-weight:700;color:var(--primary)}
.phone-screen .ps-item .psi-add{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:14px;display:flex;align-items:center;justify-content:center;margin-left:4px}

/* Search */
.search-bar{max-width:1200px;margin:0 auto;padding:0 24px 16px}
.search-bar input{width:100%;padding:12px 20px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--primary)}
.search-bar input::placeholder{color:var(--text-muted)}

/* Empty state */
.empty{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:16px}
</style>
</head>

// Determine badge class
function getBadgeClass(b) {
  if (b.category === 'stay') return 'badge-stay';
  if (b.category === 'experience') return 'badge-experience';
  if (b.category === 'surf') return 'badge-surf';
  if (b.category === 'drinks') return 'badge-drinks';
  if (b.category === 'grocery') return 'badge-grocery';
  if (b.category === 'wellness') return 'badge-wellness';
  return 'badge-food';
}
function getBadgeLabel(b) {
  if (b.category === 'stay') return 'Stay';
  if (b.category === 'experience') return 'Experience';
  if (b.category === 'surf') return 'Surf';
  if (b.category === 'drinks') return 'Drinks';
  if (b.category === 'grocery') return 'Grocery';
  if (b.category === 'wellness') return 'Wellness';
  return 'Restaurant';
}
function getFilterCat(b) {
  return b.category;
}

const grid = document.getElementById('grid');
const modalOverlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');
const searchInput = document.getElementById('searchInput');
let activeFilter = 'all';

function renderCards(filter, search) {
  let filtered = businesses;
  if (filter !== 'all') filtered = filtered.filter(b => getFilterCat(b) === filter);
  if (search) {
    const q = search.toLowerCase();
    filtered = filtered.filter(b => b.name.toLowerCase().includes(q) || b.description.toLowerCase().includes(q) || b.tags.some(t => t.toLowerCase().includes(q)));
  }
  document.getElementById('bizCount').textContent = filtered.length + ' businesses';
  grid.innerHTML = filtered.map(b => `
    <div class="biz-card" onclick="openModal('${b.id}')">
      <div class="img" style="background-image:url('${b.image}')">
        <span class="badge ${getBadgeClass(b)}">${getBadgeLabel(b)}</span>
      </div>
      <div class="info">
        <div class="name">${b.name}</div>
        <div class="desc">${b.description}</div>
        <div class="meta">
          <span class="star">★ ${b.rating}</span>
          <span>${b.reviews} reviews</span>
          ${b.deliveryTime !== 'On request' ? `<span>${b.deliveryTime} min</span>` : '<span>On request</span>'}
        </div>
        <div class="tags">${b.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
  if (!filtered.length) grid.innerHTML = '<div class="empty">No businesses found</div>';
}

function openModal(id) {
  const b = businesses.find(x => x.id === id);
  if (!b) return;
  const hours = b.hours.open === 0 && b.hours.close === 24 ? '24/7' : `${b.hours.open}:00 – ${b.hours.close}:00`;
  const menuHTML = b.products.length ? b.products.map(p => `
    <div class="menu-item">
      <img src="${p.image}" alt="${p.name}">
      <div class="mi-info">
        <div class="mi-name">${p.name}</div>
        <div class="mi-desc">${p.description}</div>
      </div>
      <div class="mi-price">$${p.price}</div>
    </div>
  `).join('') : '<p style="color:var(--text-muted);font-size:13px">Menu coming soon — contact business directly.</p>';

  const phoneItems = b.products.slice(0, 4);
  const phoneHTML = phoneItems.map(p => `
    <div class="ps-item">
      <img src="${p.image}" alt="">
      <span class="psi-name">${p.name}</span>
      <span class="psi-price">$${p.price}</span>
      <button class="psi-add">+</button>
    </div>
  `).join('');

  modal.innerHTML = `
    <div class="modal-hero" style="background-image:url('${b.image}')">
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <span class="badge ${getBadgeClass(b)}" style="display:inline-block;margin-bottom:12px">${getBadgeLabel(b)}</span>
      <div class="name">${b.name}</div>
      <div class="desc">${b.description}</div>
      <div class="meta-row">
        <span><span class="icon">★</span> ${b.rating} (${b.reviews} reviews)</span>
        <span><span class="icon">🕐</span> ${hours}</span>
        ${b.deliveryFee !== undefined && b.deliveryFee > 0 ? `<span><span class="icon">🛵</span> $${b.deliveryFee} delivery</span>` : ''}
        ${b.minOrder ? `<span><span class="icon">💰</span> Min $${b.minOrder}</span>` : ''}
        ${b.phone ? `<span><span class="icon">📞</span> +${b.phone}</span>` : ''}
      </div>
      <div class="modal-columns">
        <div class="menu-section">
          <h3>${b.vertical === 'stay' ? 'Room Options' : b.vertical === 'experience' ? 'Available Packages' : 'Menu'}</h3>
          ${menuHTML}
        </div>
        <div class="phone-mockup">
          <div class="phone-screen">
            <div class="ps-header">
              <div class="ps-back">← Back</div>
              <div class="ps-name">${b.name}</div>
              <div class="ps-meta">★ ${b.rating} · ${hours}</div>
            </div>
            <div class="ps-img" style="background-image:url('${b.image}')"></div>
            <div class="ps-info">
              <div class="ps-title">${b.name}</div>
              <div class="ps-tags">${b.tags.slice(0,3).map(t => `<span class="ps-tag">${t}</span>`).join('')}</div>
            </div>
            <div class="ps-items">${phoneHTML || '<p style="padding:12px;font-size:11px;color:#999">Menu preview</p>'}</div>
          </div>
        </div>
      </div>
    </div>
  `;
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards(activeFilter, searchInput.value);
  });
});

// Search
searchInput.addEventListener('input', () => renderCards(activeFilter, searchInput.value));

// Init
renderCards('all', '');
</script>
</body>
</html>
